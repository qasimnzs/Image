<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK | Premium CDN Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: '#4F46E5', brandHover: '#4338CA' }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(31, 41, 55, 0.7); border-color: rgba(55, 65, 81, 0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-gray-50 dark:bg-gray-900 z-50">
        <div class="w-full max-w-md p-8 glass border border-gray-200 dark:border-gray-700 rounded-3xl shadow-2xl fade-in mx-4">
            <h1 class="text-3xl font-black text-center mb-2 text-brand">GK CDN</h1>
            <p class="text-center text-gray-500 mb-8">Login to continue</p>

            <form id="loginForm" class="space-y-4">
                <input id="email" type="email" placeholder="Email Address"
                    class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand">

                <div class="relative">
                    <input id="password" type="password" placeholder="Password"
                        class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand">
                    <button type="button" id="togglePass" class="absolute right-4 top-4 text-gray-500">
                        <i class="ph ph-eye text-xl"></i>
                    </button>
                </div>

                <p id="loginErr" class="text-red-500 text-sm text-center hidden">Wrong credentials</p>

                <button class="w-full bg-brand hover:bg-brandHover text-white p-4 rounded-xl font-bold transition-all">
                    LOGIN
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app" class="hidden flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col fixed md:relative z-40 h-full transition-transform -translate-x-full md:translate-x-0">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand text-white rounded-xl flex items-center justify-center text-xl shadow-md">
                        <i class="ph ph-cloud-arrow-up"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">GK CDN</h2>
                        <span class="text-xs text-brand font-semibold">PRO</span>
                    </div>
                </div>
                <button id="closeSidebar" class="md:hidden text-gray-500 text-2xl"><i class="ph ph-x"></i></button>
            </div>

            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand/10 text-brand rounded-xl font-semibold">
                    <i class="ph ph-squares-four text-xl"></i> Dashboard
                </a>
            </nav>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between mb-4 px-2">
                    <span class="text-sm font-semibold">Theme</span>
                    <button onclick="toggleTheme()" class="w-12 h-6 rounded-full bg-gray-200 dark:bg-gray-600 relative">
                        <div id="themeKnob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 flex items-center justify-center dark:translate-x-6 transition-transform">
                            <i class="ph ph-moon text-xs text-brand"></i>
                        </div>
                    </button>
                </div>
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-50 text-red-600 dark:bg-red-500/10 rounded-xl font-semibold">
                    <i class="ph ph-sign-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- OVERLAY FOR MOBILE -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden glass"></div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col h-full relative overflow-y-auto">
            
            <!-- HEADER -->
            <header class="glass sticky top-0 z-20 px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <button id="openSidebar" class="md:hidden text-2xl"><i class="ph ph-list"></i></button>
                
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-2 rounded-xl flex items-center gap-3 ml-auto">
                    <div class="p-1.5 bg-green-100 text-green-600 rounded-lg"><i class="ph ph-image"></i></div>
                    <div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Total Images</p>
                        <p id="totalCount" class="font-bold leading-tight">0</p>
                    </div>
                </div>
            </header>

            <main class="p-6 max-w-7xl mx-auto w-full grid lg:grid-cols-2 gap-6">

                <!-- LEFT: UPLOAD SECTION -->
                <div class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm">
                        <h2 class="font-bold text-xl mb-4 text-brand">Upload Media</h2>
                        
                        <!-- EXACTLY YOUR WORKING DROPZONE HTML -->
                        <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800/50 p-8 text-center rounded-2xl relative">
                            
                            <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            
                            <div class="pointer-events-none">
                                <i class="ph ph-cloud-arrow-up text-5xl text-brand mb-2"></i>
                                <p class="text-lg font-bold">Tap to select images</p>
                                <p class="text-sm text-gray-500">or click to browse files</p>
                            </div>

                        </div>

                        <!-- STAGING / PREVIEW AREA -->
                        <div id="stagingArea" class="hidden mt-6 bg-gray-50 dark:bg-gray-900/50 p-4 rounded-2xl border border-gray-200 dark:border-gray-700">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-semibold">Selected: <span id="selectedCount" class="text-brand text-lg">0</span></h3>
                                <button type="button" onclick="clearSelection()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-lg">Clear All</button>
                            </div>
                            
                            <div id="previewList" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-4 max-h-48 overflow-y-auto"></div>

                            <button onclick="startUpload()" class="w-full bg-brand text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                                <i class="ph ph-upload-simple"></i> Upload Now
                            </button>
                        </div>

                        <!-- UPLOAD QUEUE -->
                        <div id="uploadQueue" class="mt-6 space-y-3 hidden">
                            <h3 class="font-semibold text-brand animate-pulse">Uploading to Server...</h3>
                            <div id="queueList" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: GALLERY SECTION -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col h-[calc(100vh-140px)]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-xl text-brand">Hosted Links</h2>
                        <button onclick="copyAllLinks()" class="text-sm bg-brand/10 text-brand px-4 py-2 rounded-xl font-bold">
                            Copy All
                        </button>
                    </div>

                    <input id="searchInput" type="text" placeholder="Search links..." class="w-full p-3 mb-4 bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl outline-none focus:ring-2 ring-brand">

                    <div id="linksContainer" class="flex-1 overflow-y-auto space-y-3">
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400">
                            <i class="ph ph-folder-open text-6xl mb-3 opacity-50"></i>
                            <p>No images uploaded yet.</p>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-black dark:bg-white text-white dark:text-black px-6 py-3 rounded-xl shadow-2xl font-bold text-sm hidden">
        <span id="toastMsg"></span>
    </div>

    <script>
        // ================= AUTH =================
        const ADMIN_EMAIL = "gk@gmail.com";
        const ADMIN_PASS = "gk-pitafi";

        if(localStorage.getItem("auth") === "1"){
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            renderLinks();
        }

        document.getElementById("loginForm").onsubmit = (e)=>{
            e.preventDefault();
            if(document.getElementById("email").value === ADMIN_EMAIL && document.getElementById("password").value === ADMIN_PASS){
                localStorage.setItem("auth","1");
                location.reload();
            } else {
                document.getElementById("loginErr").classList.remove("hidden");
            }
        };

        document.getElementById("togglePass").onclick = ()=>{
            const p = document.getElementById("password");
            p.type = p.type === "password" ? "text" : "password";
        };

        function logout(){
            localStorage.removeItem("auth");
            location.reload();
        }

        // ================= THEME =================
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

        function toggleTheme(){
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        // ================= SIDEBAR =================
        document.getElementById("openSidebar").onclick = () => {
            document.getElementById("sidebar").classList.remove("-translate-x-full");
            document.getElementById("sidebarOverlay").classList.remove("hidden");
        };
        const closeSide = () => {
            document.getElementById("sidebar").classList.add("-translate-x-full");
            document.getElementById("sidebarOverlay").classList.add("hidden");
        };
        document.getElementById("closeSidebar").onclick = closeSide;
        document.getElementById("sidebarOverlay").onclick = closeSide;

        // ================= EXACT UPLOAD LOGIC =================
        const cloudName = "dozknmpib";
        const uploadPreset = "Gkpitafi";
        
        let selectedFilesArray = [];
        let savedLinks = JSON.parse(localStorage.getItem('gk_links')) || [];

        const fileInput = document.getElementById("fileInput");
        const stagingArea = document.getElementById("stagingArea");
        const previewList = document.getElementById("previewList");
        const selectedCount = document.getElementById("selectedCount");
        const dropZone = document.getElementById("dropZone");

        fileInput.addEventListener("change", (e) => {
            handleFiles(e.target.files);
            fileInput.value = "";
        });

        dropZone.addEventListener("dragover", e => e.preventDefault());
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            let added = 0;
            Array.from(files).forEach(file => {
                if (!file.type.startsWith("image/")) return;

                const exists = selectedFilesArray.some(f => f.file.name === file.name && f.file.size === file.size);

                if (!exists) {
                    selectedFilesArray.push({
                        id: Math.random().toString(36).slice(2),
                        file,
                        url: URL.createObjectURL(file)
                    });
                    added++;
                }
            });

            if (added > 0) renderPreview();
        }

        function renderPreview() {
            if (selectedFilesArray.length === 0) {
                stagingArea.classList.add("hidden");
                return;
            }

            stagingArea.classList.remove("hidden");
            selectedCount.innerText = selectedFilesArray.length;
            previewList.innerHTML = "";

            selectedFilesArray.forEach(item => {
                const div = document.createElement("div");
                div.className = "relative rounded-lg overflow-hidden border border-gray-300";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full h-24 object-cover">
                    <button onclick="removeSelected('${item.id}')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center shadow">X</button>
                `;
                previewList.appendChild(div);
            });
        }

        function removeSelected(id) {
            selectedFilesArray = selectedFilesArray.filter(item => item.id !== id);
            renderPreview();
        }

        function clearSelection() {
            selectedFilesArray = [];
            renderPreview();
        }

        // ================= CLOUDINARY UPLOAD =================
        function startUpload() {
            if (selectedFilesArray.length === 0) return;
            
            document.getElementById('uploadQueue').classList.remove('hidden');
            const filesToUpload = [...selectedFilesArray];
            clearSelection();
            
            filesToUpload.forEach(item => {
                uploadToCloudinary(item.file, item.id);
            });
        }

        function uploadToCloudinary(file, fileId) {
            const queueList = document.getElementById('queueList');
            const queueItem = document.createElement('div');
            queueItem.id = `q_${fileId}`;
            queueItem.className = 'bg-gray-100 dark:bg-gray-800 p-3 rounded-lg flex items-center gap-3 text-sm font-semibold';
            queueItem.innerHTML = `
                <div class="flex-1 truncate">${file.name}</div>
                <div id="perc_${fileId}" class="text-brand">0%</div>
            `;
            queueList.prepend(queueItem);

            const fd = new FormData();
            fd.append("file", file);
            fd.append("upload_preset", uploadPreset);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById(`perc_${fileId}`).innerText = percent + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    savedLinks.unshift({ url: data.secure_url, name: file.name, id: Date.now().toString() });
                    
                    localStorage.setItem('gk_links', JSON.stringify(savedLinks));
                    renderLinks();
                    showToast("Uploaded Successfully!");
                    
                    setTimeout(() => queueItem.remove(), 1000);
                    if(queueList.children.length <= 1) setTimeout(() => document.getElementById('uploadQueue').classList.add('hidden'), 1000);
                } else {
                    queueItem.innerHTML += `<span class="text-red-500">Failed</span>`;
                }
            };
            xhr.send(fd);
        }

        // ================= GALLERY =================
        function renderLinks(filter = "") {
            const linksContainer = document.getElementById('linksContainer');
            const emptyState = document.getElementById('emptyState');
            
            const filteredLinks = savedLinks.filter(item => 
                item.name.toLowerCase().includes(filter.toLowerCase()) || 
                item.url.toLowerCase().includes(filter.toLowerCase())
            );

            document.getElementById('totalCount').innerText = savedLinks.length;

            if (filteredLinks.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(linksContainer.children).forEach(child => { if(child.id !== 'emptyState') child.remove() });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(linksContainer.children).forEach(child => { if(child.id !== 'emptyState') child.remove() });

            filteredLinks.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 p-3 bg-gray-50 dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-700";
                div.innerHTML = `
                    <img src="${item.url}" class="w-12 h-12 rounded-xl object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate">${item.name}</p>
                        <a href="${item.url}" target="_blank" class="text-xs text-blue-500 hover:underline truncate block">${item.url}</a>
                    </div>
                    <button onclick="copyText('${item.url}')" class="p-2 bg-gray-200 dark:bg-gray-800 rounded-lg"><i class="ph ph-copy"></i></button>
                    <button onclick="deleteLink('${item.id}')" class="p-2 bg-red-100 text-red-600 rounded-lg"><i class="ph ph-trash"></i></button>
                `;
                linksContainer.appendChild(div);
            });
        }

        document.getElementById('searchInput').oninput = (e) => renderLinks(e.target.value);

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showToast("Link Copied!");
        }

        function copyAllLinks() {
            if(savedLinks.length === 0) return showToast("No links to copy");
            navigator.clipboard.writeText(savedLinks.map(l => l.url).join("\n"));
            showToast("All Links Copied!");
        }

        function deleteLink(id) {
            if(confirm("Delete this image?")) {
                savedLinks = savedLinks.filter(item => item.id !== id);
                localStorage.setItem('gk_links', JSON.stringify(savedLinks));
                renderLinks();
                showToast("Deleted");
            }
        }

        // ================= TOAST =================
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            
            toast.classList.remove("hidden");
            clearTimeout(toastTimeout);

            setTimeout(() => {
                toast.classList.remove("translate-y-20", "opacity-0");
            }, 10);

            toastTimeout = setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
                setTimeout(() => toast.classList.add("hidden"), 300);
            }, 2000);
        }
    </script>
</body>
</html>
