    <!-- Toast (same) -->

    <script>
        // === AUTH, THEME, SIDEBAR (copy from previous version) ===

        const cloudName = "dozknmpib";
        const uploadPreset = "Gkpitafi";
        let selectedFilesArray = [];
        let savedLinks = JSON.parse(localStorage.getItem('gk_links')) || [];

        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.multiple = true;
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        fileInput.onchange = function() {
            window.processNativeFiles(this);
        };

        window.triggerFileSelect = function() {
            fileInput.click();
        };

        // Drag & Drop
        const dropZone = document.getElementById("dropZone");
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            window.processNativeFiles({ files: e.dataTransfer.files });
        });
        // drag visual feedback...

        window.processNativeFiles = function(input) {
            if (!input.files || input.files.length === 0) return;

            const files = Array.from(input.files);
            let added = 0;

            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                if (selectedFilesArray.some(f => f.file.name === file.name && f.file.size === file.size)) return;

                selectedFilesArray.push({
                    id: Math.random().toString(36).slice(2),
                    file: file,
                    url: URL.createObjectURL(file)
                });
                added++;
            });

            if (added > 0) {
                renderPreview();
                showToast(`${added} Images Selected`);
                document.getElementById('stagingArea').scrollIntoView({ behavior: "smooth" });
            }

            fileInput.value = '';
        };

        function renderPreview() {
            const staging = document.getElementById('stagingArea');
            const count = document.getElementById('selectedCount');
            const list = document.getElementById('previewList');

            if (selectedFilesArray.length === 0) {
                staging.classList.add('hidden');
                return;
            }

            staging.classList.remove('hidden');
            count.textContent = selectedFilesArray.length;
            list.innerHTML = '';

            selectedFilesArray.forEach(item => {
                const div = document.createElement('div');
                div.className = "relative aspect-square rounded-xl overflow-hidden border border-gray-300 dark:border-gray-600";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full h-full object-cover">
                    <button onclick="removeSelected('${item.id}')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">×</button>
                `;
                list.appendChild(div);
            });
        }

        function removeSelected(id) {
            selectedFilesArray = selectedFilesArray.filter(i => i.id !== id);
            renderPreview();
        }

        function clearSelection() {
            selectedFilesArray = [];
            renderPreview();
        }

        // Upload, renderLinks, toast functions (copy from your previous code)

    </script>
