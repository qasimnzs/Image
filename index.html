<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GK | Premium CDN Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: '#4F46E5', brandHover: '#4338CA' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(31, 41, 55, 0.7); border-color: rgba(55, 65, 81, 0.5); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        .drag-active { background-color: rgba(79, 70, 229, 0.15) !important; border-color: #4338CA !important; }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-gray-50 dark:bg-gray-900 z-50">
        <div class="w-full max-w-md p-8 glass border border-gray-200 dark:border-gray-700 rounded-3xl shadow-2xl mx-4">
            <h1 class="text-3xl font-black text-center mb-2 text-brand">GK CDN</h1>
            <p class="text-center text-gray-500 mb-8">Login to continue</p>

            <form id="loginForm" class="space-y-4">
                <input id="email" type="email" placeholder="Email Address" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                <div class="relative">
                    <input id="password" type="password" placeholder="Password" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                    <button type="button" id="togglePass" class="absolute right-4 top-4 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                        <i class="ph ph-eye text-xl"></i>
                    </button>
                </div>
                <p id="loginErr" class="text-red-500 text-sm text-center hidden font-bold">Wrong credentials</p>
                <button type="submit" class="w-full bg-brand hover:bg-brandHover text-white p-4 rounded-xl font-bold transition-all shadow-lg">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app" class="hidden flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col fixed md:relative z-40 h-full transition-transform -translate-x-full md:translate-x-0">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand text-white rounded-xl flex items-center justify-center text-xl shadow-md">
                        <i class="ph ph-cloud-arrow-up"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">GK CDN</h2>
                        <span class="text-xs text-brand font-semibold">PRO VERSION</span>
                    </div>
                </div>
                <button id="closeSidebar" class="md:hidden text-gray-500 text-2xl hover:text-red-500"><i class="ph ph-x"></i></button>
            </div>

            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand/10 text-brand rounded-xl font-semibold">
                    <i class="ph ph-squares-four text-xl"></i> Dashboard
                </a>
            </nav>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between mb-4 px-2">
                    <span class="text-sm font-semibold">Dark Mode</span>
                    <button onclick="toggleTheme()" class="w-12 h-6 rounded-full bg-gray-200 dark:bg-gray-600 relative transition-colors">
                        <div id="themeKnob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 flex items-center justify-center dark:translate-x-6 transition-transform shadow">
                            <i class="ph ph-moon text-xs text-brand"></i>
                        </div>
                    </button>
                </div>
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-50 text-red-600 dark:bg-red-500/10 rounded-xl font-semibold hover:bg-red-100 dark:hover:bg-red-500/20 transition-colors">
                    <i class="ph ph-sign-out"></i> Logout
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col h-full relative overflow-y-auto">
            <header class="glass sticky top-0 z-20 px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <button id="openSidebar" class="md:hidden text-2xl"><i class="ph ph-list"></i></button>
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-2 rounded-xl flex items-center gap-3 ml-auto shadow-sm">
                    <div class="p-1.5 bg-green-100 text-green-600 rounded-lg"><i class="ph ph-image"></i></div>
                    <div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Total Uploads</p>
                        <p id="totalCount" class="font-bold leading-tight">0</p>
                    </div>
                </div>
            </header>

            <main class="p-6 max-w-7xl mx-auto w-full grid lg:grid-cols-[1fr_1.5fr] gap-6 pb-20">

                <!-- UPLOAD SECTION -->
                <div class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm">
                        <h2 class="font-bold text-xl mb-5 flex items-center gap-2">
                            <i class="ph ph-upload-simple text-brand"></i> Upload Media
                        </h2>

                        <!-- Dropzone (Drag & Drop) -->
                        <div id="dropZone" class="relative border-2 border-brand border-dashed bg-brand/5 p-12 text-center rounded-3xl transition-all cursor-pointer">
                            <div class="pointer-events-none">
                                <i class="ph ph-images text-6xl text-brand mb-4"></i>
                                <p class="text-xl font-bold">Drag Images Here</p>
                                <p class="text-sm text-gray-500">or use button below</p>
                            </div>
                        </div>

                        <!-- Choose Images Button -->
                        <button onclick="triggerFileSelect()" class="mt-5 w-full bg-brand text-white py-5 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 active:scale-[0.97] transition-all shadow-lg">
                            <i class="ph ph-folder-open text-2xl"></i>
                            CHOOSE IMAGES FROM GALLERY
                        </button>

                        <!-- STAGING AREA -->
                        <div id="stagingArea" class="hidden mt-6 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-5 rounded-2xl shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <p class="font-bold text-gray-700 dark:text-gray-300">Selected: <span id="selectedCount" class="text-brand text-2xl">0</span></p>
                                <button onclick="clearSelection()" class="text-red-600 text-sm font-bold">Clear All</button>
                            </div>
                            <div id="previewList" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-5 max-h-64 overflow-y-auto"></div>
                            <button onclick="startUpload()" class="w-full bg-brand text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2">
                                <i class="ph ph-cloud-arrow-up"></i> Upload Now
                            </button>
                        </div>

                        <!-- UPLOAD QUEUE -->
                        <div id="uploadQueue" class="mt-6 space-y-3 hidden">
                            <h3 class="font-bold text-brand flex items-center gap-2"><i class="ph ph-spinner-gap animate-spin"></i> Uploading...</h3>
                            <div id="queueList" class="space-y-2 max-h-48 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>

                <!-- HOSTED LINKS -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col h-[calc(100vh-140px)]">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="font-bold text-xl flex items-center gap-2">
                            <i class="ph ph-link text-brand"></i> Hosted Links
                        </h2>
                        <button onclick="copyAllLinks()" class="text-sm bg-brand/10 text-brand px-4 py-2 rounded-xl font-bold hover:bg-brand/20 flex items-center gap-2">
                            <i class="ph ph-copy"></i> Copy All
                        </button>
                    </div>

                    <div class="relative mb-5">
                        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input id="searchInput" type="text" placeholder="Search links..." class="w-full pl-11 pr-4 py-3 bg-gray-100 dark:bg-gray-900 border border-transparent dark:border-gray-700 rounded-xl outline-none focus:border-brand">
                    </div>

                    <div id="linksContainer" class="flex-1 overflow-y-auto space-y-3 pr-2">
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400">
                            <i class="ph ph-folder-open text-6xl mb-3 opacity-50"></i>
                            <p class="font-medium">No images uploaded yet.</p>
                        </div>
                    </div>
                    <p class="text-xs text-center text-gray-400 mt-4">Deleting removes from this device only.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-6 py-3 rounded-2xl shadow-2xl font-bold text-sm flex items-center gap-2 opacity-0 pointer-events-none transition-all" style="display:none;">
        <i class="ph ph-check-circle text-green-500"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // ================= AUTH =================
        const ADMIN_EMAIL = "gk@gmail.com";
        const ADMIN_PASS = "gk-pitafi";

        if (localStorage.getItem("auth") === "1") {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").classList.remove("hidden");
            renderLinks();
        }

        document.getElementById("loginForm").onsubmit = (e) => {
            e.preventDefault();
            if (document.getElementById("email").value === ADMIN_EMAIL && document.getElementById("password").value === ADMIN_PASS) {
                localStorage.setItem("auth", "1");
                location.reload();
            } else {
                document.getElementById("loginErr").classList.remove("hidden");
            }
        };

        document.getElementById("togglePass").onclick = () => {
            const p = document.getElementById("password");
            const icon = document.querySelector("#togglePass i");
            if (p.type === "password") {
                p.type = "text"; icon.classList.replace("ph-eye", "ph-eye-slash");
            } else {
                p.type = "password"; icon.classList.replace("ph-eye-slash", "ph-eye");
            }
        };

        function logout() {
            localStorage.removeItem("auth");
            location.reload();
        }

        // ================= THEME & SIDEBAR =================
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

        function toggleTheme() {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        document.getElementById("openSidebar").onclick = () => {
            document.getElementById("sidebar").classList.remove("-translate-x-full");
            document.getElementById("sidebarOverlay").classList.remove("hidden");
        };
        const closeSide = () => {
            document.getElementById("sidebar").classList.add("-translate-x-full");
            document.getElementById("sidebarOverlay").classList.add("hidden");
        };
        document.getElementById("closeSidebar").onclick = closeSide;
        document.getElementById("sidebarOverlay").onclick = closeSide;

        // ================= UPLOAD SYSTEM =================
        const cloudName = "dozknmpib";
        const uploadPreset = "Gkpitafi";
        let selectedFilesArray = [];
        let savedLinks = JSON.parse(localStorage.getItem('gk_links')) || [];

        // Hidden File Input
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.multiple = true;
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        fileInput.onchange = () => window.processNativeFiles(fileInput);

        window.triggerFileSelect = () => fileInput.click();

        const dropZone = document.getElementById("dropZone");
        ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.add('drag-active')));
        ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-active')));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            window.processNativeFiles({ files: e.dataTransfer.files });
        });

        window.processNativeFiles = function(input) {
            if (!input.files || input.files.length === 0) return;

            const files = Array.from(input.files);
            let added = 0;

            files.forEach(file => {
                if (!file.type.startsWith("image/")) return;
                if (selectedFilesArray.some(f => f.file.name === file.name && f.file.size === file.size)) return;

                selectedFilesArray.push({
                    id: Math.random().toString(36).slice(2),
                    file: file,
                    url: URL.createObjectURL(file)
                });
                added++;
            });

            if (added > 0) {
                renderPreview();
                showToast(`${added} Images Selected!`);
                document.getElementById("stagingArea").scrollIntoView({ behavior: "smooth" });
            }

            fileInput.value = "";
        };

        function renderPreview() {
            const staging = document.getElementById("stagingArea");
            const countEl = document.getElementById("selectedCount");
            const list = document.getElementById("previewList");

            if (selectedFilesArray.length === 0) {
                staging.classList.add("hidden");
                return;
            }

            staging.classList.remove("hidden");
            countEl.textContent = selectedFilesArray.length;
            list.innerHTML = "";

            selectedFilesArray.forEach(item => {
                const div = document.createElement("div");
                div.className = "relative aspect-square rounded-xl overflow-hidden border border-gray-300 dark:border-gray-600 group";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full h-full object-cover">
                    <button onclick="removeSelected('${item.id}')" class="absolute top-2 right-2 bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-lg shadow-lg">×</button>
                `;
                list.appendChild(div);
            });
        }

        function removeSelected(id) {
            selectedFilesArray = selectedFilesArray.filter(item => item.id !== id);
            renderPreview();
        }

        function clearSelection() {
            selectedFilesArray = [];
            renderPreview();
        }

        function startUpload() {
            if (selectedFilesArray.length === 0) return;
            document.getElementById('uploadQueue').classList.remove('hidden');
            const filesToUpload = [...selectedFilesArray];
            clearSelection();

            filesToUpload.forEach(item => uploadToCloudinary(item.file, item.id));
        }

        function uploadToCloudinary(file, fileId) {
            const queueList = document.getElementById('queueList');
            const queueItem = document.createElement('div');
            queueItem.id = `q_${fileId}`;
            queueItem.className = 'bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 rounded-xl flex items-center gap-3';
            queueItem.innerHTML = `
                <i class="ph ph-image text-xl text-gray-400"></i>
                <div class="flex-1 truncate">${file.name}</div>
                <div id="perc_${fileId}" class="text-brand font-bold">0%</div>
            `;
            queueList.prepend(queueItem);

            const fd = new FormData();
            fd.append("file", file);
            fd.append("upload_preset", uploadPreset);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    document.getElementById(`perc_${fileId}`).innerText = Math.round((e.loaded / e.total) * 100) + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    savedLinks.unshift({ url: data.secure_url, name: file.name, id: Date.now().toString() });
                    localStorage.setItem('gk_links', JSON.stringify(savedLinks));
                    renderLinks();
                    showToast("Uploaded Successfully!");
                    setTimeout(() => queueItem.remove(), 800);
                } else {
                    alert("Upload failed for " + file.name);
                    document.getElementById(`perc_${fileId}`).innerText = 'Failed';
                    document.getElementById(`perc_${fileId}`).classList.add('text-red-500');
                }
            };

            xhr.send(fd);
        }

        // ================= GALLERY =================
        function renderLinks(filter = "") {
            const container = document.getElementById('linksContainer');
            const empty = document.getElementById('emptyState');
            const filtered = savedLinks.filter(item => 
                item.name.toLowerCase().includes(filter.toLowerCase()) || 
                item.url.toLowerCase().includes(filter.toLowerCase())
            );

            document.getElementById('totalCount').innerText = savedLinks.length;

            if (filtered.length === 0) {
                empty.style.display = 'flex';
                Array.from(container.children).forEach(c => { if (c.id !== 'emptyState') c.remove(); });
                return;
            }

            empty.style.display = 'none';
            Array.from(container.children).forEach(c => { if (c.id !== 'emptyState') c.remove(); });

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 p-3 bg-gray-50 dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-700";
                div.innerHTML = `
                    <img src="${item.url}" class="w-12 h-12 rounded-xl object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold truncate">${item.name}</p>
                        <a href="\( {item.url}" target="_blank" class="text-xs text-brand truncate block"> \){item.url}</a>
                    </div>
                    <button onclick="copyText('${item.url}')" class="p-2 text-gray-600"><i class="ph ph-copy"></i></button>
                    <button onclick="deleteLink('${item.id}')" class="p-2 text-red-600"><i class="ph ph-trash"></i></button>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('searchInput').oninput = (e) => renderLinks(e.target.value);

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showToast("Link Copied!");
        }

        function copyAllLinks() {
            if (savedLinks.length === 0) return showToast("No links");
            navigator.clipboard.writeText(savedLinks.map(l => l.url).join("\n"));
            showToast("All Links Copied!");
        }

        function deleteLink(id) {
            if (confirm("Remove from dashboard?")) {
                savedLinks = savedLinks.filter(item => item.id !== id);
                localStorage.setItem('gk_links', JSON.stringify(savedLinks));
                renderLinks();
            }
        }

        // ================= TOAST =================
        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            toast.style.display = "flex";
            toast.classList.remove("opacity-0");

            setTimeout(() => {
                toast.classList.add("opacity-0");
                setTimeout(() => toast.style.display = "none", 400);
            }, 2500);
        }
    </script>
</body>
</html>
