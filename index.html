<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK | Premium CDN Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:#f8fafc;
}
.glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); }
.hidden { display:none !important; }
.fade { animation: fade .3s ease; }
@keyframes fade { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
</style>
</head>

<body class="min-h-screen text-gray-900">

<!-- LOGIN -->
<div id="login" class="fixed inset-0 flex items-center justify-center bg-white z-50">
    <div class="w-full max-w-sm p-6 fade">
        <h1 class="text-3xl font-black text-center mb-2">GK CDN</h1>
        <p class="text-center text-gray-400 mb-8">Login to continue</p>

        <form id="loginForm" class="space-y-4">
            <input id="email" type="email" placeholder="Email"
                class="w-full p-4 rounded-xl bg-gray-100 outline-none">

            <div class="relative">
                <input id="password" type="password" placeholder="Password"
                    class="w-full p-4 rounded-xl bg-gray-100 outline-none">
                <button type="button" id="toggle"
                    class="absolute right-4 top-4 text-sm">👁</button>
            </div>

            <button class="w-full bg-black text-white p-4 rounded-xl font-bold">
                LOGIN
            </button>

            <p id="err" class="text-red-500 text-xs text-center hidden">Wrong credentials</p>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">

<!-- TOP BAR -->
<header class="glass sticky top-0 p-4 flex justify-between items-center border-b">
    <h1 class="font-black text-xl">GK CDN PRO</h1>

    <div class="flex gap-3">
        <button onclick="toggleTheme()" class="text-xs px-3 py-2 bg-gray-100 rounded-lg">Theme</button>
        <button onclick="logout()" class="text-xs px-3 py-2 bg-red-100 text-red-600 rounded-lg">Logout</button>
    </div>
</header>

<main class="p-6 max-w-6xl mx-auto grid lg:grid-cols-2 gap-6">

<!-- UPLOAD -->
<div class="bg-white p-6 rounded-3xl border">
    <h2 class="font-bold mb-4">Upload Images</h2>

    <input type="file" id="file" multiple class="mb-4">

    <button onclick="uploadFiles()"
        class="w-full bg-black text-white py-3 rounded-xl font-bold">
        Start Upload
    </button>

    <div id="preview" class="grid grid-cols-4 gap-2 mt-4"></div>
</div>

<!-- LINKS -->
<div class="bg-white p-6 rounded-3xl border">
    <div class="flex justify-between mb-4">
        <h2 class="font-bold">Links</h2>
        <button onclick="copyAll()" class="text-xs bg-gray-100 px-3 py-1 rounded-lg">
            Copy All
        </button>
    </div>

    <input id="search" placeholder="Search links..."
        class="w-full p-3 mb-4 bg-gray-100 rounded-xl">

    <div id="list" class="space-y-3"></div>
</div>

</main>
</div>

<!-- TOAST -->
<div id="toast"
class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-xl text-xs hidden">
Copied
</div>

<script>
// ===== AUTH =====
const ADMIN_EMAIL = "gk@gmail.com";
const ADMIN_PASS = "gk-pitafi";

const login = document.getElementById("login");
const app = document.getElementById("app");

if(localStorage.getItem("auth") === "1"){
    login.classList.add("hidden");
    app.classList.remove("hidden");
}

document.getElementById("loginForm").onsubmit = (e)=>{
e.preventDefault();

if(email.value === ADMIN_EMAIL && password.value === ADMIN_PASS){
    localStorage.setItem("auth","1");
    location.reload();
}else{
    err.classList.remove("hidden");
}
};

// password toggle
toggle.onclick = ()=>{
password.type = password.type === "password" ? "text":"password";
};

// ===== THEME =====
function toggleTheme(){
document.body.classList.toggle("bg-gray-900");
document.body.classList.toggle("text-white");
}

// ===== LOGOUT =====
function logout(){
localStorage.removeItem("auth");
location.reload();
}

// ===== UPLOAD =====
const cloudName="dozknmpib";
const uploadPreset="Gkpitafi";

let links=[];

file.onchange = ()=>{
preview.innerHTML="";
[...file.files].forEach(f=>{
const r=new FileReader();
r.onload=e=>{
preview.innerHTML += `<img src="${e.target.result}" class="w-full h-16 object-cover rounded-lg">`;
};
r.readAsDataURL(f);
});
};

async function uploadFiles(){
const files=file.files;
if(!files.length) return;

for(let i=0;i<files.length;i++){
const fd=new FormData();
fd.append("file",files[i]);
fd.append("upload_preset",uploadPreset);

const res=await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,{
method:"POST",
body:fd
});

const data=await res.json();

if(data.secure_url){
const url=data.secure_url;
links.unshift(url);
addLink(url);
}
}
}

// ===== ADD LINK =====
function addLink(url){
const div=document.createElement("div");
div.className="flex gap-2";

div.innerHTML=`
<input value="${url}" readonly class="flex-1 p-2 bg-gray-100 rounded-lg text-xs">
<button onclick="copy('${url}')" class="bg-black text-white px-3 rounded-lg text-xs">Copy</button>
`;

list.prepend(div);
}

// ===== COPY =====
function copy(text){
navigator.clipboard.writeText(text);
toastShow();
}

function copyAll(){
navigator.clipboard.writeText(links.join("\n"));
toastShow("All Copied");
}

// ===== TOAST =====
function toastShow(msg="Copied"){
toast.innerText=msg;
toast.classList.remove("hidden");
setTimeout(()=>toast.classList.add("hidden"),1500);
}

// ===== SEARCH =====
search.oninput=()=>{
const val=search.value.toLowerCase();
document.querySelectorAll("#list div").forEach(el=>{
el.style.display=el.innerText.toLowerCase().includes(val)?"flex":"none";
});
};
</script>

</body>
</html>
