<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GK | Premium CDN Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: '#4F46E5', brandHover: '#4338CA' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(31, 41, 55, 0.7); }
        .drag-active { background-color: rgba(79, 70, 229, 0.15) !important; border-color: #4338CA !important; }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- LOGIN SCREEN (same) -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-gray-50 dark:bg-gray-900 z-50">
        <div class="w-full max-w-md p-8 glass border border-gray-200 dark:border-gray-700 rounded-3xl shadow-2xl mx-4">
            <h1 class="text-3xl font-black text-center mb-2 text-brand">GK CDN</h1>
            <p class="text-center text-gray-500 mb-8">Login to continue</p>
            <form id="loginForm" class="space-y-4">
                <input id="email" type="email" placeholder="Email Address" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                <div class="relative">
                    <input id="password" type="password" placeholder="Password" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                    <button type="button" id="togglePass" class="absolute right-4 top-4 text-gray-500"><i class="ph ph-eye text-xl"></i></button>
                </div>
                <p id="loginErr" class="text-red-500 text-sm text-center hidden font-bold">Wrong credentials</p>
                <button type="submit" class="w-full bg-brand hover:bg-brandHover text-white p-4 rounded-xl font-bold">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="hidden flex h-screen overflow-hidden">
        <!-- SIDEBAR (same) -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r ..."> ... </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <div class="flex-1 flex flex-col h-full overflow-y-auto">
            <header class="glass sticky top-0 z-20 px-6 py-4 border-b flex justify-between items-center">
                <button id="openSidebar" class="md:hidden text-2xl"><i class="ph ph-list"></i></button>
                <div class="ml-auto bg-white dark:bg-gray-800 border px-4 py-2 rounded-xl flex items-center gap-3">
                    <div class="text-green-600"><i class="ph ph-image"></i></div>
                    <div><p class="text-xs">Total Uploads</p><p id="totalCount" class="font-bold">0</p></div>
                </div>
            </header>

            <main class="p-6 max-w-7xl mx-auto w-full grid lg:grid-cols-[1fr_1.5fr] gap-6 pb-20">

                <!-- UPLOAD SECTION -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border shadow-sm">
                    <h2 class="font-bold text-xl mb-5 flex items-center gap-2"><i class="ph ph-upload-simple text-brand"></i> Upload Media</h2>

                    <div id="dropZone" class="border-2 border-dashed border-brand bg-brand/5 p-12 rounded-3xl text-center cursor-pointer">
                        <i class="ph ph-images text-6xl text-brand mb-4"></i>
                        <p class="text-lg font-bold">Tap or Drag Images Here</p>
                    </div>

                    <!-- STAGING AREA - FIXED -->
                    <div id="stagingArea" class="hidden mt-6 border border-gray-200 dark:border-gray-700 rounded-2xl p-5 bg-white dark:bg-gray-900">
                        <div class="flex justify-between items-center mb-4">
                            <p class="font-bold text-lg">Selected: <span id="selectedCount" class="text-brand text-2xl">0</span></p>
                            <button onclick="clearSelection()" class="text-red-600 font-medium">Clear All</button>
                        </div>
                        <div id="previewList" class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-h-64 overflow-y-auto"></div>
                        <button onclick="startUpload()" class="mt-6 w-full bg-brand text-white py-4 rounded-2xl font-bold text-lg">🚀 Upload Now</button>
                    </div>

                    <div id="uploadQueue" class="hidden mt-6">
                        <h3 class="font-bold text-brand mb-3">Uploading...</h3>
                        <div id="queueList" class="space-y-3"></div>
                    </div>
                </div>

                <!-- HOSTED LINKS (same) -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border flex flex-col h-[calc(100vh-140px)]">
                    <!-- ... your gallery code ... -->
                </div>
            </main>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-2 opacity-0" style="display:none">
        <i class="ph ph-check-circle"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // ... (Auth, Theme, Sidebar same as before) ...

        const cloudName = "dozknmpib";
        const uploadPreset = "Gkpitafi";
        let selectedFilesArray = [];
        let savedLinks = JSON.parse(localStorage.getItem('gk_links')) || [];

        const fileInput = document.getElementById("fileInput") || document.createElement('input');
        if (!document.getElementById("fileInput")) {
            fileInput.type = 'file';
            fileInput.multiple = true;
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);
        }

        const dropZone = document.getElementById("dropZone");
        dropZone.addEventListener('click', () => fileInput.click());

        window.processNativeFiles = function(input) {
            const files = Array.from(input.files || []);
            let added = 0;

            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                if (selectedFilesArray.some(f => f.name === file.name)) return;

                selectedFilesArray.push({
                    id: Math.random().toString(36),
                    file: file,
                    name: file.name,
                    url: URL.createObjectURL(file)
                });
                added++;
            });

            if (added > 0) {
                renderPreview();
                showToast(`${added} Images Selected`);
            }
            fileInput.value = '';
        };

        function renderPreview() {
            const staging = document.getElementById("stagingArea");
            const list = document.getElementById("previewList");
            const count = document.getElementById("selectedCount");

            staging.classList.remove("hidden");
            staging.style.display = "block";   // Force show
            count.textContent = selectedFilesArray.length;

            list.innerHTML = "";

            selectedFilesArray.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "relative aspect-square rounded-xl overflow-hidden border border-gray-300 dark:border-gray-600";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full h-full object-cover">
                    <button onclick="removeSelected(${index})" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center text-xl shadow">×</button>
                `;
                list.appendChild(div);
            });
        }

        window.removeSelected = function(index) {
            selectedFilesArray.splice(index, 1);
            renderPreview();
        };

        function clearSelection() {
            selectedFilesArray = [];
            document.getElementById("stagingArea").classList.add("hidden");
        }

        function startUpload() {
            if (selectedFilesArray.length === 0) return;
            document.getElementById("uploadQueue").classList.remove("hidden");
            const toUpload = [...selectedFilesArray];
            clearSelection();
            toUpload.forEach(item => uploadToCloudinary(item));
        }

        // Upload, Gallery, Toast functions (same as last version)
        // ... copy from previous response if needed ...

        fileInput.onchange = () => window.processNativeFiles(fileInput);
    </script>
</body>
</html>
