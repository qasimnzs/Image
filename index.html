<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK | Premium CDN Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: '#4F46E5', brandHover: '#4338CA' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(31, 41, 55, 0.7); }
        .drag-active { background-color: rgba(79, 70, 229, 0.15) !important; border-color: #4338CA !important; }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-gray-50 dark:bg-gray-900 z-50">
        <div class="w-full max-w-md p-8 glass border border-gray-200 dark:border-gray-700 rounded-3xl shadow-2xl mx-4">
            <h1 class="text-3xl font-black text-center mb-2 text-brand">GK CDN</h1>
            <p class="text-center text-gray-500 mb-8">Login to continue</p>
            <form id="loginForm" class="space-y-4">
                <input id="email" type="email" placeholder="Email Address" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                <div class="relative">
                    <input id="password" type="password" placeholder="Password" required class="w-full p-4 rounded-xl bg-gray-100 dark:bg-gray-800 outline-none focus:ring-2 ring-brand font-medium">
                    <button type="button" id="togglePass" class="absolute right-4 top-4 text-gray-500"><i class="ph ph-eye text-xl"></i></button>
                </div>
                <p id="loginErr" class="text-red-500 text-sm text-center hidden font-bold">Wrong credentials</p>
                <button type="submit" class="w-full bg-brand hover:bg-brandHover text-white p-4 rounded-xl font-bold">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app" class="hidden flex h-screen overflow-hidden">
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col fixed md:relative z-40 h-full transition-transform -translate-x-full md:translate-x-0">
            <!-- Sidebar same as original -->
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand text-white rounded-xl flex items-center justify-center text-xl"><i class="ph ph-cloud-arrow-up"></i></div>
                    <div><h2 class="font-bold">GK CDN</h2><span class="text-xs text-brand">PRO</span></div>
                </div>
                <button id="closeSidebar" class="md:hidden"><i class="ph ph-x"></i></button>
            </div>
            <nav class="flex-1 px-4 py-4"><a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand/10 text-brand rounded-xl font-semibold"><i class="ph ph-squares-four"></i> Dashboard</a></nav>
            <div class="p-4 border-t">
                <button onclick="toggleTheme()" class="w-full flex justify-between px-4 py-3"><span>Dark Mode</span><div class="w-12 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative"><div id="themeKnob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 dark:translate-x-6"></div></div></button>
                <button onclick="logout()" class="w-full mt-3 bg-red-50 text-red-600 py-3 rounded-xl font-semibold">Logout</button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <div class="flex-1 flex flex-col h-full overflow-y-auto">
            <header class="glass sticky top-0 z-20 px-6 py-4 border-b flex justify-between">
                <button id="openSidebar" class="md:hidden"><i class="ph ph-list text-2xl"></i></button>
                <div class="ml-auto bg-white dark:bg-gray-800 px-4 py-2 rounded-xl flex gap-3">
                    <div class="text-green-600"><i class="ph ph-image"></i></div>
                    <div><p class="text-xs">Total Uploads</p><p id="totalCount" class="font-bold">0</p></div>
                </div>
            </header>

            <main class="p-6 max-w-7xl mx-auto w-full grid lg:grid-cols-[1fr_1.5fr] gap-6">

                <!-- UPLOAD SECTION -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border shadow-sm">
                    <h2 class="font-bold text-xl mb-5 flex items-center gap-2"><i class="ph ph-upload-simple text-brand"></i> Upload Media</h2>
                    
                    <div id="dropZone" class="relative border-2 border-dashed border-brand bg-brand/5 p-12 text-center rounded-3xl cursor-pointer">
                        <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="processNativeFiles(this)">
                        <div>
                            <i class="ph ph-images text-6xl text-brand mb-4"></i>
                            <p class="text-lg font-bold">Tap or drag images here</p>
                        </div>
                    </div>

                    <div id="stagingArea" class="hidden mt-6 bg-white dark:bg-gray-900 border rounded-2xl p-5">
                        <div class="flex justify-between mb-4">
                            <p class="font-bold">Selected: <span id="selectedCount" class="text-brand text-2xl">0</span></p>
                            <button onclick="clearSelection()" class="text-red-600">Clear All</button>
                        </div>
                        <div id="previewList" class="grid grid-cols-3 gap-3 max-h-64 overflow-auto"></div>
                        <button onclick="startUpload()" class="mt-6 w-full bg-brand text-white py-4 rounded-2xl font-bold">Upload Now</button>
                    </div>

                    <div id="uploadQueue" class="hidden mt-6">
                        <h3 class="font-bold text-brand mb-3 flex items-center gap-2"><i class="ph ph-spinner-gap animate-spin"></i> Uploading...</h3>
                        <div id="queueList" class="space-y-2"></div>
                    </div>
                </div>

                <!-- HOSTED LINKS -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border flex flex-col h-[calc(100vh-140px)]">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="font-bold text-xl flex items-center gap-2"><i class="ph ph-link text-brand"></i> Hosted Links</h2>
                        <button onclick="copyAllLinks()" class="bg-brand/10 text-brand px-4 py-2 rounded-xl font-medium">Copy All</button>
                    </div>
                    <div class="relative mb-5">
                        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input id="searchInput" type="text" placeholder="Search links..." class="w-full pl-11 pr-4 py-3 bg-gray-100 dark:bg-gray-900 rounded-xl outline-none focus:border-brand">
                    </div>
                    <div id="linksContainer" class="flex-1 overflow-y-auto space-y-3"></div>
                    <div id="emptyState" class="hidden flex-col items-center justify-center text-gray-400 h-full">
                        <i class="ph ph-folder-open text-6xl mb-3"></i>
                        <p>No images uploaded yet</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-2 opacity-0 transition-all" style="display:none">
        <i class="ph ph-check-circle"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // Auth, Theme, Sidebar (same)
        const ADMIN_EMAIL = "gk@gmail.com";
        const ADMIN_PASS = "gk-pitafi";
        if(localStorage.getItem("auth") === "1"){
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").classList.remove("hidden");
            renderLinks();
        }
        document.getElementById("loginForm").onsubmit = (e) => {
            e.preventDefault();
            if(document.getElementById("email").value === ADMIN_EMAIL && document.getElementById("password").value === ADMIN_PASS){
                localStorage.setItem("auth","1"); location.reload();
            } else document.getElementById("loginErr").classList.remove("hidden");
        };
        function logout(){ localStorage.removeItem("auth"); location.reload(); }
        function toggleTheme(){ document.documentElement.classList.toggle('dark'); }

        // Sidebar handlers
        document.getElementById("openSidebar").onclick = () => document.getElementById("sidebar").classList.remove("-translate-x-full");
        document.getElementById("closeSidebar").onclick = () => document.getElementById("sidebar").classList.add("-translate-x-full");

        // Upload Logic
        const cloudName = "dozknmpib";
        const uploadPreset = "Gkpitafi";
        let selectedFilesArray = [];
        let savedLinks = JSON.parse(localStorage.getItem('gk_links')) || [];

        window.processNativeFiles = function(input) {
            const files = Array.from(input.files || []);
            let added = 0;
            files.forEach(file => {
                if (!file.type.startsWith("image/")) return;
                if (selectedFilesArray.some(f => f.file.name === file.name)) return;
                selectedFilesArray.push({id: Math.random().toString(36), file, url: URL.createObjectURL(file), name: file.name});
                added++;
            });
            if (added > 0) {
                renderPreview();
                showToast(`${added} Images Selected`);
            }
        };

        function renderPreview() {
            const staging = document.getElementById("stagingArea");
            const list = document.getElementById("previewList");
            document.getElementById("selectedCount").textContent = selectedFilesArray.length;
            staging.classList.remove("hidden");
            list.innerHTML = "";
            selectedFilesArray.forEach((item, i) => {
                const div = document.createElement("div");
                div.className = "relative aspect-square rounded-xl overflow-hidden border";
                div.innerHTML = `<img src="\( {item.url}" class="w-full h-full object-cover"><button onclick="removeSelected( \){i})" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full">×</button>`;
                list.appendChild(div);
            });
        }

        window.removeSelected = (i) => { selectedFilesArray.splice(i, 1); renderPreview(); };
        function clearSelection() { selectedFilesArray = []; document.getElementById("stagingArea").classList.add("hidden"); }

        function startUpload() {
            if (!selectedFilesArray.length) return;
            document.getElementById("uploadQueue").classList.remove("hidden");
            const toUpload = [...selectedFilesArray];
            clearSelection();
            toUpload.forEach(item => uploadToCloudinary(item));
        }

        function uploadToCloudinary(item) {
            const queueList = document.getElementById("queueList");
            const div = document.createElement("div");
            div.className = "bg-gray-100 dark:bg-gray-900 p-3 rounded-xl flex justify-between";
            div.innerHTML = `<div>\( {item.name}</div><div id="p_ \){item.id}" class="text-brand font-bold">0%</div>`;
            queueList.appendChild(div);

            const fd = new FormData();
            fd.append("file", item.file);
            fd.append("upload_preset", uploadPreset);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`);
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) document.getElementById(`p_${item.id}`).textContent = Math.round((e.loaded/e.total)*100) + "%";
            };
            xhr.onload = () => {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    savedLinks.unshift({url: data.secure_url, name: item.name, id: Date.now().toString()});
                    localStorage.setItem('gk_links', JSON.stringify(savedLinks));
                    renderLinks();
                    showToast("Uploaded Successfully!");
                }
                setTimeout(() => div.remove(), 1000);
                if (queueList.children.length === 0) document.getElementById("uploadQueue").classList.add("hidden");
            };
            xhr.send(fd);
        }

        function renderLinks() {
            const container = document.getElementById("linksContainer");
            const empty = document.getElementById("emptyState");
            document.getElementById("totalCount").textContent = savedLinks.length;

            container.innerHTML = "";
            if (savedLinks.length === 0) {
                empty.classList.remove("hidden");
                return;
            }
            empty.classList.add("hidden");

            savedLinks.forEach(item => {
                const div = document.createElement("div");
                div.className = "flex gap-4 p-4 bg-gray-50 dark:bg-gray-900 rounded-2xl border";
                div.innerHTML = `
                    <img src="${item.url}" class="w-14 h-14 object-cover rounded-xl">
                    <div class="flex-1">
                        <p class="font-medium truncate">${item.name}</p>
                        <a href="\( {item.url}" target="_blank" class="text-xs text-brand"> \){item.url}</a>
                    </div>
                    <button onclick="copyText('${item.url}')" class="text-gray-600"><i class="ph ph-copy"></i></button>
                `;
                container.appendChild(div);
            });
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showToast("Link Copied!");
        }

        function copyAllLinks() {
            if (!savedLinks.length) return showToast("No links");
            navigator.clipboard.writeText(savedLinks.map(l => l.url).join("\n"));
            showToast("All Links Copied!");
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            t.style.display = "flex";
            t.classList.remove("opacity-0");
            setTimeout(() => { t.classList.add("opacity-0"); setTimeout(() => t.style.display="none", 400); }, 2500);
        }

        // Dropzone click
        document.getElementById("dropZone").addEventListener("click", () => document.getElementById("fileInput").click());
    </script>
</body>
</html>
